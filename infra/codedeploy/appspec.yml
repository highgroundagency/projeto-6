# Revisão do CodeDeploy para a EC2. O pacote não traz código: traz a
# referência da imagem (imagem.env, com digest), o Caddyfile e os ganchos.
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/prumo/revisao

file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: scripts/limpar.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/preparar.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/iniciar.sh
      timeout: 180
      runas: root
  ValidateService:
    - location: scripts/validar.sh
      timeout: 240
      runas: root
